[package]
name = "everarc"
version = "0.21.0"
edition = "2024"
rust-version = "1.87"
description = "Long-term financial planning from TOML with an interactive HTML dashboard"
repository = "https://github.com/gvieira/everarc"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
minijinja = "2.24.0"
notify = "8.2.0"
rust_decimal = { version = "1.43.0", default-features = false, features = ["maths", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
toml = "1.1.5"
