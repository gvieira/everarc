[display]
locale = "en-US"

[plan]
currency = "USD"
start = "2026-01"
end = "2045-12"
withdrawal_rate = "0.04"

# One BTC equals 85000 USD.
[[conversion_rates]]
from = "BTC"
to = "USD"
rate = "85000.00"

# End-of-month actual balances, shared across scenarios. These two complete
# months make the dashboard's actual-total comparison line and history visible.
[actual_months."2026-01"]
balances = { brokerage = "88500.00", bitcoin = "0.255" }

[actual_months."2026-02"]
note = "Received a bonus and invested more than planned, despite an unexpected car maintenance expense."
balances = { brokerage = "91250.00", bitcoin = "0.260" }

# Shared total-balance goals, expressed in the plan currency.
[[milestones]]
id = "financial-independence"
name = "Financial independence"
target = "1500000.00"

# Expected end-of-plan monthly costs in today's purchasing power.
[[future_living_costs]]
id = "housing"
name = "Housing"
description = "Rent, building fees, and maintenance."
annual_inflation = "0.06"
monthly_cost = "2500.00"

[[future_living_costs]]
id = "health"
name = "Health insurance"
description = "Health coverage and recurring medical expenses."
monthly_cost = "1500.00"

[[future_living_costs]]
id = "daily-life"
name = "Everyday living"
description = "Groceries, transport, services, and leisure."
monthly_cost = "2000.00"

[[scenarios]]
id = "baseline"
name = "Baseline"
description = "Projection with expected returns, inflation, and contributions."
annual_inflation = "0.03"
monthly_income = { amount = "10000.00", currency = "USD" }

[[scenarios.assets]]
id = "brokerage"
name = "Brokerage account"
currency = "USD"
annual_expected_return = "0.06"
monthly_contribution = { amount = "2500.00", currency = "USD" }

[[scenarios.assets.holdings]]
id = "world-etf"
name = "World ETF"
currency = "USD"
value = "60000.00"

[[scenarios.assets.holdings]]
id = "treasury-bonds"
name = "Treasury bonds"
currency = "USD"
value = "25000.00"

[[scenarios.assets]]
id = "bitcoin"
name = "Bitcoin"
currency = "BTC"
annual_expected_return = "0.08"
monthly_contribution = { amount = "0", currency = "USD" }

[[scenarios.assets.holdings]]
id = "bitcoin-balance"
name = "Bitcoin balance"
currency = "BTC"
value = "0.25"

# A temporary asset is visible and contributes to the plan only during its
# inclusive lifecycle. Its holding value is the opening balance in 2032-01.
[[scenarios.assets]]
id = "bond-ladder"
name = "Short-term bond ladder"
currency = "USD"
annual_expected_return = "0.04"
monthly_contribution = { amount = "0", currency = "USD" }
monthly_withdrawal = { amount = "100.00", currency = "USD" }
starts = "2032-01"
ends = "2037-12"

[[scenarios.assets.holdings]]
id = "bond-ladder-balance"
name = "Short-term bonds"
currency = "USD"
value = "10000.00"

[[scenarios.events]]
id = "increase-contribution"
name = "Increase contribution"
date = "2028-01"
type = "set_monthly_contribution"
asset_id = "brokerage"
monthly_contribution = { amount = "3000.00", currency = "USD" }

[[scenarios.events]]
id = "increase-expected-return"
name = "Increase expected return"
date = "2034-01"
type = "set_annual_expected_return"
asset_id = "brokerage"
rate = "0.08"

[[scenarios.events]]
id = "car-purchase"
name = "Car purchase"
date = "2030-06"
type = "asset_adjustment"
asset_id = "brokerage"
amount = "-25000.00"

[[scenarios.milestones]]
id = "brokerage-500k"
name = "Brokerage reaches 500k"
asset_id = "brokerage"
target = "500000.00"

[[scenarios]]
id = "optimistic"
name = "Optimistic"
description = "Higher-growth scenario with inherited baseline assumptions."
extends = "baseline"
selected = true

# This child overrides only the expected return; every other asset field inherits.
[[scenarios.assets]]
id = "brokerage"
annual_expected_return = "0.07"

# This child event overrides the inherited 2028 contribution setting.
[[scenarios.events]]
id = "optimistic-increase-contribution"
name = "Increase optimistic contribution"
date = "2028-01"
type = "set_monthly_contribution"
asset_id = "brokerage"
monthly_contribution = { amount = "3500.00", currency = "USD" }

[[scenarios.milestones]]
id = "brokerage-750k"
name = "Brokerage reaches 750k"
asset_id = "brokerage"
target = "750000.00"
