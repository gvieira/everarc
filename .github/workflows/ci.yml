name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust with rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --check

  test:
    name: Tests and Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust with Clippy
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test
        run: cargo +stable test --locked
      - name: Strict Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  msrv:
    name: Minimum Rust version (1.87.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.87.0
        run: rustup toolchain install 1.87.0 --profile minimal
      - run: cargo +1.87.0 test --locked
